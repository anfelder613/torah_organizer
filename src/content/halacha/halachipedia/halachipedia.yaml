title: "Halachipedia"
description: >-
  A collaborative, wiki-style (MediaWiki) encyclopedia of practical halacha,
  covering daily life, lifecycle events, and the Yamim Tovim. Articles are
  organized both by everyday topic (Shabbat, Kashrut, Tefillah, etc.) and by
  the three classic relationships — Bein Adam LaMakom, Bein Adam L'Atzmo, and
  Bein Adam LaChaveiro. All content is required to be sourced (Talmud through
  modern poskim and responsa), and unsourced material is removed on sight —
  but only articles published through Yeshiva University have been formally
  reviewed by a rabbi (Rabbi Mordechai Willig); most other entries have not.
  Best used as a well-sourced starting point and index into the primary
  sources on a topic, not as a psak — the site itself frames it as a
  reference tool, presents machlokesim neutrally rather than ruling between
  them, and says to ask your own Orthodox rabbi for anything practical or
  situation-specific.
